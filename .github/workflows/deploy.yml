# Demo deploy: pytest -> docker build -> push ghcr.io/<owner>/hinglish-translit:<git sha>
#              -> az containerapp update to that image -> smoke-test the live URL.
# Azure login is OIDC (federated credential); no passwords are stored. Setup: DEPLOY.md.
# The deploy job runs only once the repo variables AZURE_CLIENT_ID etc. exist, so the first
# push (before Azure is set up) just tests, builds and pushes the image.
name: deploy-demo

on:
  push:
    branches: [main]
    paths:
      - "serve/**"
      - "finetune/translit.py"
      - "finetune/data.py"
      - "model/**"
      - "tokenizer/hinglish.py"
      - "data/normalize.py"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: serve/requirements*.txt
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r serve/requirements.txt -r serve/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('serve/MODEL_ID') }}
      - name: pytest
        run: python -m pytest -q serve/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hinglish-translit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: serve/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update the container app to this commit's image
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update -n "${{ vars.ACA_APP_NAME }}" -g "${{ vars.ACA_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}:${{ github.sha }}" --only-show-errors -o none
          fqdn=$(az containerapp show -n "${{ vars.ACA_APP_NAME }}" -g "${{ vars.ACA_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "URL=https://${fqdn}" >> "$GITHUB_ENV"
      - name: Smoke test the live URL
        run: |
          # wait (cold start from zero replicas) until the new revision answers /health with this commit
          for i in $(seq 1 40); do
            v=$(curl -fsS --max-time 30 "$URL/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
            [ "$v" = "${{ github.sha }}" ] && break
            echo "waiting for the new revision (got '${v}')"; sleep 15
          done
          [ "$v" = "${{ github.sha }}" ] || { echo "::error::new revision never became healthy"; exit 1; }
          out=$(curl -fsS --max-time 60 -X POST "$URL/api/transliterate" -H 'Content-Type: application/json' \
                -d '{"text": "kya haal hai"}')
          echo "$out"
          echo "$out" | python3 -c 'import json,re,sys; o=json.load(sys.stdin)["output"]; sys.exit(0 if re.search("[ऀ-ॿ]", o) else 1)'
          echo "### Deployed ${{ github.sha }} to $URL" >> "$GITHUB_STEP_SUMMARY"
