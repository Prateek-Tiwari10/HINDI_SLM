# Tokenizer sweep and encoding config (Decision D4). Scripts read values from here only.

hf:
  tokenizer_repo: Prateek-Tiwari10/hindi-lm-tokenizer
  dataset_repo: Prateek-Tiwari10/hindi-lm-data
  # v2: the sweep is retrained on final_v2. v1 models stay under sweep/, v2 ones go to sweep_v2/.
  sweep_prefix: sweep_v2/             # ladder + 8 grid .model/.vocab + train info, in the tokenizer repo
  work_prefix: work/v2/tokenizer/     # sample info, in the dataset repo
  final_prefix: final_v2/
  final_markers_prefix: work/v2/final_markers_random/   # split done-markers; the sample waits for all of them
  encoded_prefix: work/v2/encoded/
  tokenized_prefix: tokenized/v2/

runtime:
  work_dir: /tmp/hindi-lm
  out_dir: /kaggle/working/out
  threads: auto                      # auto = every core (4 on the CPU kernel, many more on the TPU VM)
  max_threads: 64                     # cap for 'auto' (the TPU VM has ~100+ cores; SentencePiece gains little past this)

sample:
  # Nested samples of train docs, one per ladder rung. A doc is in rung k when its id-hash draw
  # is < fractions[k], so the 5% sample is inside the 15% one, which is inside the 30% one.
  # Each doc goes to one "band" file; rung k trains on bands 0..k (no text is stored twice).
  split: train
  upsample: false                     # same source proportions as train, no upsampling
  max_line_chars: 2000
  band_dir: /tmp/hindi-lm/tok/bands   # scratch; rebuilt each run (deterministic), not uploaded
  val_docs: 20_000
  val_out_path: /tmp/hindi-lm/tok/val_docs.jsonl.gz
  seed: 2024

ladder:
  # Does a bigger tokenizer sample give a better tokenizer? Train one tokenizer per rung, score
  # each on the same val docs, then apply this rule (fixed before any result is seen):
  #   use the smallest rung whose fertility is within fertility_tol (relative) of the largest
  #   trained rung, and whose heavy-split rate is within heavy_split_tol_pp (absolute) of it.
  # Morphology is reported but not used: 154 words is too few to separate close samples.
  model_type: unigram
  vocab_size: 8192
  fractions: [0.05, 0.15, 0.30]
  # Trained only if the last two rungs still differ by more than the tolerances (the curve has
  # not flattened yet) and the RAM guard allows it.
  extend_fraction: 0.50
  fertility_tol: 0.005
  heavy_split_tol_pp: 0.10
  # RAM guard: v1 measured 10.3 GB peak Unigram RAM for a 0.95 GB sample (~11x). A rung is
  # skipped, and the skip logged, when 11x its text would exceed ram_headroom of free RAM.
  ram_per_text_byte: 11.0
  ram_headroom: 0.85

sweep:
  model_types: [bpe, unigram]
  vocab_sizes: [8192, 10240, 12288, 16384]
  out_dir: /tmp/hindi-lm/tok/out

trainer:
  character_coverage: 0.9995
  byte_fallback: true
  split_digits: true
  normalization_rule_name: identity   # our normalize() already ran; SPM's NFKC would undo NFC
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3
  chat_symbols: ["<|system|>", "<|user|>", "<|assistant|>"]
  num_reserved_symbols: 16            # <|reserved_0|> ... <|reserved_15|>
  input_sentence_size: 0              # 0 = every line of the sample (v1 used a 5M-line cap); logged
  # SentencePiece's suffix array is int32 by default and fails on ~2.1B+ characters.
  large_corpus_chars: 1_500_000_000   # above this, train_extremely_large_corpus=true (same result, 64-bit index)
  shuffle_input_sentence: true
  max_sentence_length: 16384

metrics:
  heavy_split_pieces: 4
  embedding_dim: 512
  model_params: 60_000_000

morphology:
  # The 8 stems from the decision log, plus 16 more of the same kind: 8 x 12 = 96
  # candidates is too few to reach ~200 real words after the frequency filter.
  stems: ["लड़क", "किताब", "पढ़", "खा", "बात", "घर", "कहान", "सोच",
          "बच्च", "लिख", "देख", "चल", "सुन", "बोल", "खेल", "समझ",
          "बैठ", "मिल", "रात", "सड़क", "कपड़", "दोस्त", "शहर", "गा"]
  suffixes: ["ों", "ियों", "े", "ी", "ा", "ें", "ाएँगे", "ेंगे", "ता", "ती", "ते", "कर"]
  min_count_in_sample: 20
  target_words: 200
  out_path: tokenizer/morph_words.tsv

selection:
  fertility_gain_threshold: 0.03      # elbow: next size improves fertility by < 3%
  max_embedding_share: 0.15
  fallback_vocab: 16384
  tie_fertility_margin: 0.02          # within 2% -> tie; ties go to Unigram
  tie_winner: unigram
  # "Clearly better" on a secondary metric (only used when fertility is within 2%):
  clear_margin_heavy_split_pp: 1.0    # >= 1 percentage point fewer heavy splits
  clear_margin_morphology_pp: 5.0     # >= 5 percentage points higher morphology score
  # If the two algorithms pick different sizes, compare them at the larger one.
  common_size_rule: larger

examples:                             # same 10 sentences tokenized by every tokenizer
  - "भारत एक विशाल और विविधताओं से भरा देश है।"
  - "लड़कियों ने स्कूल में नई किताबें पढ़ीं।"
  - "हम कल सुबह दिल्ली जाएँगे और शाम तक लौट आएँगे।"
  - "प्रधानमंत्री ने 2024 में 15 नई योजनाओं की घोषणा की।"
  - "वैज्ञानिकों ने जलवायु परिवर्तन पर एक नया अध्ययन प्रकाशित किया।"
  - "क्या आप मुझे रेलवे स्टेशन का रास्ता बता सकते हैं?"
  - "बच्चे मैदान में क्रिकेट खेल रहे थे।"
  - "उसने अपनी माँ के लिए स्वादिष्ट खाना बनाया।"
  - "कंप्यूटर और इंटरनेट ने हमारी ज़िंदगी बदल दी है।"
  - "गंगा नदी हिमालय से निकलकर बंगाल की खाड़ी में गिरती है।"

encode:
  dtype: uint16
  shard_tokens: 500_000_000
  shuffle_seed: 1337
  wikipedia_train_repeats: 2
  encode_batch_docs: 2000
  min_train_tokens: 1_800_000_000     # D1: STOP if the real train count is below this
